# TRIAL (#630). Not managed by rungate — this file is hand-written and
# caller-owned while we find out whether the thing is worth scaffolding.
#
# What this is: Claude reviews the pull request, running on Red Hat's Vertex
# project rather than against an Anthropic API key or a Copilot credit pool.
# `use_vertex` means inference bills `itpc-gcp-global-revenue-claude` at Vertex
# rates; there is no credit pool to exhaust and no subscription rate-limit
# window shared with an interactive session.
#
# WHAT THIS IS NOT, YET: a gate. It posts comments and nothing else. Do NOT add
# it to branch protection in this form. A required check that only ever
# concludes success is the defect `.claude/rules/checks-must-be-able-to-fail.md`
# is about, and #630 exists to build the version that can actually fail —
# including the three-state auth ladder so a consumer with no credentials
# reports UNMEASURED rather than a green check over a review that never ran.
#
# Verified 2026-10-18 before this file was written: the service account
# `claude-ci@itpc-gcp-global-revenue-claude.iam.gserviceaccount.com` holding
# only `roles/aiplatform.user` returns HTTP 200 from
# `publishers/anthropic/models/claude-sonnet-5:rawPredict` at location
# `global`. An earlier 403 was IAM propagation, not configuration.
#
# Region: `global`. `us-east5` returned 429 — the project's per-minute token
# quota is already consumed by other users, and Anthropic's own guidance for
# 429s is to move to the global endpoint.
#
# Model: PINNED. Unpinned, the `opus` alias resolves to Opus 5.5 on Vertex and
# every review bills at the Opus rate.
#
# KNOWN GAPS, both tracked on #630. Neither is acceptable in a version that
# runs on pull requests from people who are not you:
#
#  1. `google-github-actions/auth` writes `gha-creds-*.json` into
#     `$GITHUB_WORKSPACE` — the directory this agent then reads. A static GCP
#     key sits in the same tree as attacker-influenceable diff text. The tool
#     deny list below removes the exfiltration path; it does not remove the
#     key. Workload Identity Federation does, and that is the fix.
#
#  2. `plugin_marketplaces` loads executing code from a MUTABLE git ref. Every
#     `uses:` here is SHA-pinned and a test asserts it — and then this input
#     fetches a plugin from `main`. Same property, different syntax, which is
#     the shape `.claude/rules/checks-must-be-able-to-fail.md` §#484 is about.
#     Whether the input accepts a pinned ref is unverified.
#
# Every `uses:` is pinned to a commit SHA, per this repo's convention.
name: Claude review (trial)

# MANUAL DISPATCH ONLY, deliberately. This ran automatically on pull_request
# for three commits, proved the Vertex path works, and is now parked.
#
# It is parked because the third security review found the finding that ends
# the argument: `create_inline_comment` is an EGRESS SINK. The agent can read
# the credentials file and post its contents as a review comment, using the
# one tool this job exists to use. No Bash, no network, no fork required. The
# denylist below cannot close that, and neither can a longer denylist —
# two rounds of enumeration missed `Task` and then `SlashCommand`, which is
# what an incomplete enumeration always looks like from the inside.
#
# Re-enable the `pull_request:` trigger when AC-15 lands and no credential is
# readable from the tree the agent walks. Not before.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true
        type: string
  # pull_request:
  #   types: [opened, synchronize, ready_for_review, reopened]

# Least privilege. `pull-requests: write` is the only write, and it is what
# lets Claude post the review. `id-token: write` is required for the OIDC
# exchange even though this trial authenticates with a key, because the action
# requests it for its own GitHub App auth path.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

# One review per PR at a time. A force-push storm should not fan out into
# parallel jobs against a project whose quota is already contended.
concurrency:
  group: claude-review-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same-repo pull requests only, while a static GCP key is still written
    # into the workspace this agent reads. GitHub withholds secrets from fork
    # PRs anyway, which would make the auth step fail rather than skip — this
    # says no deliberately instead of failing by accident, and it is the
    # actual boundary of the exposure described in the header.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          # Without this, checkout writes GITHUB_TOKEN into .git/config —
          # a second credential in the tree the agent reads. The review
          # needs the files, not the ability to push.
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Review
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_vertex: "true"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ inputs.pr }}"
          # --allowedTools is required even though the skill's own frontmatter
          # names the same tool: the action starts the inline-comment MCP
          # server only when claude_args names it.
          # A DENYLIST IS NOT THE CONTROL HERE, and the first draft of this
          # file pretended it was. It listed six tools and left `Task`, which
          # spawns a subagent that the parent's denylist does not bind — a
          # hole wide enough to put Bash through. Enumerating badness fails
          # the moment the enumeration is incomplete, and it was.
          #
          # The control is that the secret should not be in the tree at all.
          # Until WIF lands (#630, AC-15) this list is a delay, not a defence,
          # and the fork guard above is what actually bounds the exposure.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,BashOutput,KillShell,Task,SlashCommand,ExitPlanMode,Write,Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch"
            --max-turns 25
        env:
          CLAUDE_CODE_USE_VERTEX: "1"
          ANTHROPIC_VERTEX_PROJECT_ID: itpc-gcp-global-revenue-claude
          CLOUD_ML_REGION: global
          ANTHROPIC_MODEL: claude-sonnet-5
