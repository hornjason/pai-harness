  test-shard:
    runs-on: "ubuntu-latest"
    strategy:
      # One red shard must not cancel the others: the whole point is to see
      # every failure in one run rather than re-running to find the next.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
