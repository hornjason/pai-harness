# Managed by rungate — do not edit. Customize the ci section of .claude/rungate/config.json.
name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the comparison base for the conformity ratchet
        run: |
          git fetch --no-tags --depth=200 origin '+refs/heads/main:refs/remotes/origin/main' \
            || echo "WARN: could not fetch main; the conformity allowlist growth check will report UNMEASURED."
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned by .bun-version — the project's single declaration (#622).
          # setup-bun reads that file, so there is no version spelled here to drift from it.
          bun-version-file: ".bun-version"
      - run: bun install
      # Pinned by ci.globalTools in .claude/rungate/config.json — one declaration (#597).
      - name: Install pinned global tools
        run: npm install -g 'agnix@0.59.0' '@reporails/cli@0.6.4'
      - run: bun test
      - run: bun run typecheck
