            exit 1
          fi

          # Check the SEAL before reading the baseline for anything (#843 finding 2).
          # The file is in RUNNER_TEMP, which is writable by whatever the reviewer is
          # granted; the checksum came out of a step that has already finished.
          #
          # Two absences, pulling in opposite directions and deliberately not folded
          # together. No seal at all means the baseline step could not compute one —
          # UNMEASURED, warn and carry on, because the comparison still catches an
          # honest reviewer. A seal that EXISTS and cannot be recomputed means the tool
          # was there at the start of the job and is not here now, and a reading that
          # can be taken once and not twice is not a reading that passed.
          expected="${AI_REVIEW_TREE_BEFORE_SHA:-}"
          if [ -z "${expected}" ]; then
            echo "::warning title=AI review UNMEASURED::the baseline arrived with no checksum, so nothing here can tell it from one edited after it was taken. The comparison below still runs and still refuses a tree the reviewer moved; what is UNMEASURED is the baseline's own integrity."
          else
            if ! actual=$(sha256_of "${AI_REVIEW_TREE_BEFORE}"); then
              echo "::error title=AI review modified the tree::the baseline step sealed its reading, and neither sha256sum nor shasum can be run here to check it. A reading that could be taken at the start of the job and cannot be taken at the end is not a reading that passed. Refusing rather than comparing against a file nobody can vouch for." >&2
              exit 1
            fi
            if [ "${actual}" != "${expected}" ]; then
              echo "::error title=AI review modified the tree::the baseline file does not match the checksum the baseline step emitted, so it was edited after it was taken. The comparison below subtracts that file's lines from the tree, so a baseline the reviewer can append to is a verdict the reviewer writes. Refusing (#843)." >&2
              exit 1
            fi
          fi

          # `--untracked-files=all` because the case most likely to occur is a NEW
          # file, which neither `git diff` nor the default `-unormal` fully sees: the
          # default stops at a new directory's name.
          #
          # Checked on its own line, for the reason the baseline step states.
          if ! after=$(read_tree); then
            echo "::error title=AI review modified the tree::git status failed, so the tree was never read and this check is UNMEASURED: $(escape_annotation "${after}")" >&2
            exit 1
          fi

          # Both readings, because a path can become unhashable between them and either
          # side blinds the comparison at that path. Reported, not refused: a filename
          # git has to quote is a thing a repository is allowed to contain, and a gate
          # that refuses one is a gate consumers delete. Silence is what would make it
          # indistinguishable from a path compared by content.
          unhashed=$( { printf '%s\n' "${after}"; cat "${AI_REVIEW_TREE_BEFORE}"; } \
            | grep -E '^(unquotable|unreadable) ' | sort -u | head -20 || true)
          if [ -n "${unhashed}" ]; then
            echo "::warning title=AI review UNMEASURED::at least one path in this tree could not be read by content — git had to quote its name, or the file could not be hashed — so for those paths this run compares names only and an edit the reviewer made to one would not be seen. Every other path is compared by content as usual. UNMEASURED at the paths named: $(escape_annotation "${unhashed}")"
          fi

          # The reading OUTSIDE the checkout (#843 finding 1), before the comparison
          # below, because that one exits 0 the moment the tree is clean and a clean
          # tree is exactly the run in which an escaped write is the whole story.
          #
          # No allowlist of interesting directories. The finding's own example is an
          # `auth.json` an unrelated job left in the runner's home, and nobody
          # predicts the next filename — a scoped walk would be a detector narrower
          # than what it detects.
          #
          # What IS subtracted is the runtime's own directories, which is the opposite
          # move: not a list of places to look, a list of places whose writes have been
          # measured and attributed. Two hosted runs produced 25 paths and all 25 are
          # in the first two lists below (#866); one self-hosted run produced 30 more
          # and all 30 are the CI runner's own _diag, which is the third (#877).
          # Interpolated from AI_REVIEW_RUNTIME_INERT_PATHS and
          # AI_REVIEW_RUNTIME_CONFIG_PATHS so each list has one declaring position; a
          # literal here would be a second.
          #
          # TWO PASSES, because the floor is not one kind of thing (#871). Pass 1
          # refuses anything in neither list. Pass 2 matches ONLY the config list and
          # reports it as UNMEASURED without refusing: the runtime rewrites those files
          # on every run, so a refusal there fires on every pull request and gets the
          # gate deleted — and they declare hooks, MCP servers and the plugin
          # directory, so subtracting them in silence is reporting CLEAN about the one
          # write that reaches the next job. Neither answer is available, which is what
          # UNMEASURED is for.
          #
          # Two exclusions, both because the directory is already accounted for:
          # GITHUB_WORKSPACE is what the comparison below reads, and RUNNER_TEMP is
          # this job's own scratch, holding the payload, this baseline and the
          # relocated credential. The `:-` defaults are a path that cannot exist, so
          # an unset variable excludes nothing rather than excluding everything.
          #
          # `-maxdepth 4` is a BOUND, not a filter, and it
          # is here because an unbounded walk is not shippable: measured during
          # development, the same step over a developer's home directory had not
          # finished after ten minutes. A self-hosted runner's home can be arbitrarily
          # large and this step runs on every pull request. What it costs is honest and
          # stated rather than hidden — a write deeper than
          # 4 levels under \$HOME is not seen. The
          # finding's own example, a stray credential left in the runner's home, sits
          # at depth 1 to 3.
          if [ -z "${HOME:-}" ] || [ ! -d "${HOME}" ]; then
            echo "::warning title=AI review UNMEASURED::HOME is unset or is not a directory, so nothing could look for writes the reviewer made OUTSIDE the checkout (#843 finding 1). The tree comparison below is unaffected. This run is UNMEASURED on everything the grant permits outside the working directory, which is not the same as a run in which nothing was written there."
          else
            outside=$(find "${HOME}" -xdev -maxdepth 4 -type f \
              -newer "${AI_REVIEW_TREE_BEFORE}" \
              -not -path "${GITHUB_WORKSPACE:-/nonexistent-workspace}/*" \
              -not -path "${RUNNER_TEMP:-/nonexistent-temp}/*" \
              -not -path "${HOME}/.claude/.last-cleanup" \
              -not -path "${HOME}/.claude/cache" -not -path "${HOME}/.claude/cache/*" \
              -not -path "${HOME}/.npm/_logs" -not -path "${HOME}/.npm/_logs/*" \
              -not -path "${HOME}/.claude.json" \
              -not -path "${HOME}/.claude/settings.json" \
              -not -path "${HOME}/.claude/plugins" -not -path "${HOME}/.claude/plugins/*" \
              -not -path "${HOME}/.claude/backups" -not -path "${HOME}/.claude/backups/*" \
              -not -path "${HOME}/.claude/state" -not -path "${HOME}/.claude/state/*" \
              -not -path "${HOME}/.claude/sessions" -not -path "${HOME}/.claude/sessions/*" \
              -not -path "${HOME}/.bun/install/cache" -not -path "${HOME}/.bun/install/cache/*" \
              -not -path "${HOME}/.claude/projects" -not -path "${HOME}/.claude/projects/*" \
              -not -path "${HOME}/.claude/downloads" -not -path "${HOME}/.claude/downloads/*" \
              -not -path "${HOME}/.gitconfig" \
              -not -path "${HOME}/.npm/_npx" -not -path "${HOME}/.npm/_npx/*" \
              ! \( \( -path "${HOME}/*/_diag" -o -path "${HOME}/*/_diag/*" \) -a ! \( -path "${HOME}/*/*/_diag" -o -path "${HOME}/*/*/_diag/*" \) \) \
              ! \( \( -path "${HOME}/*/_work/_temp" -o -path "${HOME}/*/_work/_temp/*" \) -a ! \( -path "${HOME}/*/*/_work/_temp" -o -path "${HOME}/*/*/_work/_temp/*" \) \) \
              2>/dev/null | head -50 || true)

            # Pass 2: the config half of the floor, reported by name and NOT refused.
            # Matching rather than excluding, so this says what it found instead of
            # what it let through. No `head` bound difference from pass 1 and no
            # overlap with it — pass 1 excluded every path this can match.
            runtime_config=$(find "${HOME}" -xdev -maxdepth 4 -type f \
              -newer "${AI_REVIEW_TREE_BEFORE}" \
              -not -path "${GITHUB_WORKSPACE:-/nonexistent-workspace}/*" \
              -not -path "${RUNNER_TEMP:-/nonexistent-temp}/*" \
              \( \
                -path "${HOME}/.claude.json" \
                -o -path "${HOME}/.claude/settings.json" \
                -o -path "${HOME}/.claude/plugins" -o -path "${HOME}/.claude/plugins/*" \
                -o -path "${HOME}/.claude/backups" -o -path "${HOME}/.claude/backups/*" \
                -o -path "${HOME}/.claude/state" -o -path "${HOME}/.claude/state/*" \
                -o -path "${HOME}/.claude/sessions" -o -path "${HOME}/.claude/sessions/*" \
                -o -path "${HOME}/.bun/install/cache" -o -path "${HOME}/.bun/install/cache/*" \
                -o -path "${HOME}/.claude/projects" -o -path "${HOME}/.claude/projects/*" \
                -o -path "${HOME}/.claude/downloads" -o -path "${HOME}/.claude/downloads/*" \
                -o -path "${HOME}/.gitconfig" \
                -o -path "${HOME}/.npm/_npx" -o -path "${HOME}/.npm/_npx/*" \
              \) \
              2>/dev/null | head -50 || true)
            if [ -n "${runtime_config}" ]; then
              echo "::warning title=AI review UNMEASURED::the reviewer's job wrote to the runtime's own CONFIGURATION under \$HOME, and this step cannot tell that write from the one the CLI makes on every start — the paths below are rewritten by the runtime on every run, so neither their presence nor their content distinguishes the two (#871). These are not inert state: they declare MCP servers, hooks, the plugin directory and what the next npx resolves, or they carry session state and keys a runtime reads back as trusted context (#907, #913), so a write here reaches what the CLI does on its next start, and on a shared self-hosted runner that is another repository's build (#843 finding 1). This run is UNMEASURED at these paths, which is not the same as a run in which the reviewer did not write to them. Paths: $(escape_annotation "${runtime_config}")"
            fi

            if [ -n "${outside}" ]; then
              echo "::error title=AI review wrote outside the checkout::the reviewer wrote OUTSIDE the checkout, to a path the runtime does not own. The tool grant anchors at the working directory, so this was permitted; on a shared self-hosted runner \$HOME persists between jobs, so a file here reaches another repository's build (#843 finding 1). The runtime's own directories are subtracted before this fires — .claude/.last-cleanup, .claude/cache, .npm/_logs as inert state, and .claude.json, .claude/settings.json, .claude/plugins, .claude/backups, .claude/state, .claude/sessions, .bun/install/cache, .claude/projects, .claude/downloads, .gitconfig, .npm/_npx as runtime config reported separately as UNMEASURED (#871) — and those cover every path two measured runs produced (#866). The CI runner's own diagnostics are subtracted too — */_diag, */_work/_temp — because on a pool whose runners share a home directory those are written by SIBLING runner processes building other repositories, continuously and by design (#877). What is left is neither the runtime nor the runner. A sibling runner's _work checkout is NOT subtracted: a write there is another repository's source tree and is the finding, not the floor. If this runner is self-hosted, whatever else shares its home has still never been read, and the path below is the reading that would start that. Paths: $(escape_annotation "${outside}")" >&2
              # The annotation is emitted HERE and the exit is DEFERRED to the end of
              # the step, which is not the same thing as warning. Both readings refuse;
              # exiting here would mean a reviewer that edited the tree AND touched
              # \$HOME got the less specific of the two diagnostics, because this
              # block runs first on purpose. The tree comparison below names the file
              # it changed, so it goes first in the REPORT; this goes first in the
              # READING, because the comparison exits 0 the moment the tree is clean
              # and a clean tree is exactly the run in which an escaped write is the
              # whole story.
              outside_refused=1
            fi
          fi

          # The DIFFERENCE, not the total. A line present before the reviewer started is
          # not something the reviewer did — `google-github-actions/auth` writes its
          # credentials file into GITHUB_WORKSPACE, and a total reading accused the
          # agent of it on every credentialed run. There is no pattern here to widen and
          # no name to exclude: the comparison is the whole statement.
          added=$(printf '%s\n' "${after}" | grep -F -x -v -f "${AI_REVIEW_TREE_BEFORE}" || true)

          if [ -z "${added}" ]; then
            # The tree is clean. The outside reading is the only thing left that can
            # refuse, and it has already said what it found.
            if [ -n "${outside_refused:-}" ]; then
              exit 1
            fi
            exit 0
          fi

          # Every path here came out of the branch under review, so a filename is a
          # string an attacker picks. It reaches the annotation through the same
          # encoder as git's error output above, for the same reason and on the same
          # line as its capture — the first draft encoded only the second use, and a
          # value that is safe at one of its two uses is not encoded, it is lucky.
          echo "::error title=AI review modified the tree::The reviewer modified the tree it was reviewing: $(escape_annotation "${added}"). A review that edits the code under review is not a result." >&2
          exit 1
