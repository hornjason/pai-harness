# Managed by rungate — do not edit. Customize the ci section of .claude/rungate/config.json.
#
# THREE OUTCOMES, and only one of them is a review that found nothing.
#
#   1. REVIEWED AND BLOCKING — the reviewer ran and wrote a finding at a
#      severity that blocks. This check must fail.
#   2. REVIEWED AND CLEAN — the reviewer ran and found nothing blocking.
#      This check passes, and it is the only outcome that means the code
#      was looked at and was fine.
#   3. UNMEASURED FOR WANT OF CREDENTIALS — no credential resolved, so no
#      reviewer ran. This is NOT outcome 2. The job annotates it on every
#      run. To activate the gate:
#        the repository secret `CLAUDE_CODE_OAUTH_TOKEN` or
#        `ANTHROPIC_API_KEY`, or the Vertex federation this project already
#        declares.
#      Set the repository variable RUNGATE_REQUIRE_AI_REVIEW to
#      'true' to make an unmeasured review FAIL instead of warn.
#
# NOT YET: the first outcome is not enforced. The findings reader exists
# and is reachable as `rungate ai-review-findings`, and no step in this job runs
# it (#675) — so a blocking finding is reported in the comments and the
# check is green. The job says so on every run rather than exiting 0 in
# silence; "reviewed, and nobody read the result" is its own state.
#
# This job is deliberately unconditional. A job skipped by a condition reports
# `skipped`, which a required status check can be configured to accept, and
# that is a green check for a review that never ran. The credential check
# happens inside `run:` instead, and reports UNMEASURED when there is none.
#
# The second step says the same thing for the other door: a credential that
# resolved with no reviewer wired to use it (#631) has also not produced a
# review, and a check that stays quiet about that is the same defect.
#
# AUTHENTICATION. There is no service-account key in this file and no input
# that could carry one. Vertex authenticates with Workload Identity
# Federation: GitHub mints a short-lived OIDC token for this run, GCP's STS
# exchanges it for an access token that expires in an hour, and no long-lived
# credential exists anywhere on the runner (#677 AC-15). What this job holds
# as read from this consumer's config:
#   ci.vertex declares project jhorn-pai and a Workload Identity Federation provider, so this job mints a short-lived federated credential and holds no service-account key
name: AI Review

on:
  # See the block comment in lib/scaffold/steps.ts: no branches: filter, and
  # its absence hangs a merge queue silently rather than failing it (#867).
  merge_group:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read
  # Mint the OIDC token Workload Identity Federation exchanges (#631).
  id-token: write

jobs:
  ai-review:
    runs-on: "ubuntu-latest"
    steps:
      - name: Detect AI review credentials
        id: ai-review-auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNGATE_REQUIRE_AI_REVIEW: ${{ vars.RUNGATE_REQUIRE_AI_REVIEW }}
        run: |
          # Generated by rungate — lib/scaffold/ai-review-step.ts. Do not edit.
          #
          # Resolves exactly one of 4 modes: vertex, oauth, api-key, none.
          # The decision is here and not in an `if:` expression on purpose — `secrets`
          # is unavailable in `if:`, and a skipped step can satisfy a required check.
          #
          # It also reports `ambient`, which is NOT a 5th mode and is not a
          # credential this job uses (#679). It names what the runner was carrying when
          # no credential resolved, so the UNMEASURED annotation stops saying the
          # machine is empty when it is not.
          #
          # Vertex, as read from this consumer's config when the file was generated:
          #   ci.vertex declares project jhorn-pai and a Workload Identity Federation provider, so this job mints a short-lived federated credential and holds no service-account key
          set -uo pipefail

          mode=none
          # ci.vertex is declared, so this job reviews on Vertex. Decided when the
          # file was generated — there is nothing here for a secret to change, and
          # no service-account key exists anywhere in this job (#677 AC-15).
          mode=vertex

          if [ "${mode}" = none ]; then
            if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
              mode=oauth
            elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
              mode=api-key
            fi
          fi

          # What the RUNNER has that this job did not use (#679). Read only in the
          # credential-free state, because that is the only state in which the
          # annotation makes a claim about it, and read as a PATH rather than as a
          # credential: this resolves no mode, so a stale or expired file cannot
          # produce a usable-looking one. Presence is not validity and the annotation
          # says so.
          ambient=
          if [ "${mode}" = none ]; then
            adc_file="${GOOGLE_APPLICATION_CREDENTIALS:-${CLOUDSDK_CONFIG:-${HOME:-}/.config/gcloud}/application_default_credentials.json}"
            if [ -f "${adc_file}" ]; then
              ambient=adc
            fi
          fi

          echo "ai-review auth mode: ${mode}"
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
            echo "ambient=${ambient}" >> "${GITHUB_OUTPUT}"
          fi

          if [ "${mode}" != none ]; then
            exit 0
          fi

          # Two whole literals rather than one annotation with a variable in it. This
          # script carries no escape_annotation helper — it has never needed one,
          # because every annotation in it is a generated literal — and AC-8 in
          # test/ai-review-security-repairs.test.ts is mechanical by design: any
          # annotation interpolating a shell value must go through the encoder, and it
          # does not ask whether this particular value is attacker-reachable. Keeping
          # both branches literal keeps that true, and keeps the count at one
          # annotation, which is what aiReviewUnmeasuredViolations enforces.
          if [ -n "${ambient}" ]; then
            echo "::warning title=AI review UNMEASURED::No Claude credential is configured in this job (CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY, a ci.vertex federation provider), so no AI review ran on this pull request. This check is UNMEASURED, not a passing review. Set the repository variable RUNGATE_REQUIRE_AI_REVIEW to 'true' to make an unmeasured review fail instead. This runner also carries Application Default Credentials (GOOGLE_APPLICATION_CREDENTIALS or CLOUDSDK_CONFIG). ADC alone authenticates to Vertex, so a credential this job could have reviewed on is present on the runner and was not used. It is REPORTED, NOT READ: no mode is resolved from it and nothing here validates it, because validating ADC means exchanging it for an access token and a file that exists is not a token that still refreshes. Reviewing on an ambient login is a separate decision from scaffolding this workflow and there is no route to it today (#679)."
          else
            echo "::warning title=AI review UNMEASURED::No Claude credential is configured in this job (CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY, a ci.vertex federation provider), so no AI review ran on this pull request. This check is UNMEASURED, not a passing review. Set the repository variable RUNGATE_REQUIRE_AI_REVIEW to 'true' to make an unmeasured review fail instead."
          fi

          if [ "${RUNGATE_REQUIRE_AI_REVIEW:-}" = "true" ]; then
            echo "::error title=AI review UNMEASURED::RUNGATE_REQUIRE_AI_REVIEW is 'true' and no credential is configured, so this pull request has no AI review. Failing rather than reporting a green check for a review that never happened." >&2
            exit 1
          fi

          exit 0
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Choose a findings path outside the checkout
        id: ai-review-prepare
        run: |
          # Generated by rungate — lib/scaffold/ai-review-step.ts. Do not edit.
          set -uo pipefail

          escape_annotation() {
            local v="$1"
            v="${v//%/%25}"
            v="${v//$'\r'/%0D}"
            v="${v//$'\n'/%0A}"
            printf '%s' "${v}"
          }

          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::error title=AI review UNMEASURED::RUNNER_TEMP is not set, so there is nowhere outside the checkout to write the findings payload. Refusing rather than writing it into the branch under review, where the branch could have committed it already." >&2
            exit 1
          fi

          nonce="${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
          # A per-run DIRECTORY holding the payload and nothing else, because
          # `--add-dir` grants directories and the only directory it may name is one
          # whose other contents are nothing. The baseline and the credential are
          # SIBLINGS of this path, under RUNNER_TEMP's root, and stay outside the grant.
          dir="${RUNNER_TEMP}/ai-review-findings-${nonce}.d"
          path="${dir}/ai-review-findings.json"

          case "${dir}" in
            *[[:space:]]*)
              echo "::error title=AI review UNMEASURED::RUNNER_TEMP contains whitespace, so the findings directory cannot be passed to the reviewer: the claude_args string is emitted unquoted and split on whitespace, so the --add-dir grant would name a different path than the one the payload is written to and the reviewer would be denied its own output file. Refusing rather than granting a path nobody chose: $(escape_annotation "${dir}")" >&2
              exit 1
              ;;
          esac

          # FIRST, and before anything that dereferences: `-e`, `-d` and `-O` all
          # follow symlinks, so a `-L` test placed after any of them reads the
          # target and says nothing about the link.
          if [ -L "${dir}" ]; then
            echo "::error title=AI review UNMEASURED::the findings directory path under RUNNER_TEMP is a SYMLINK. It is handed to the reviewer as a writable directory, so a link left by an earlier job on this runner would grant the reviewer write access to wherever it points. Refusing, and not following or removing it: $(escape_annotation "${dir}")" >&2
            exit 1
          fi

          # ANY pre-existing path refuses. The nonce is run id plus attempt, so this
          # step cannot legitimately meet its own directory — anything here came from
          # somewhere else. Refuse, do not delete, and do not inspect the owner: an
          # ownership test is one more thing to get subtly wrong when "nothing may be
          # here at all" is both simpler and stricter.
          if [ -e "${dir}" ]; then
            echo "::error title=AI review UNMEASURED::the findings directory under RUNNER_TEMP already exists. Its name carries this run id and attempt, so nothing this job did put it there: a reused runner is holding a leftover, and writing the payload into it would hand a reviewer's output to whoever does own it. Refusing rather than adopting it — and not deleting it, because what to do with another user's directory is not this job's decision: $(escape_annotation "${dir}")" >&2
            exit 1
          fi

          # `-m 700` and no `-p`. The mode is set AT CREATION, so there is no window
          # in which the directory exists world-readable; and without `-p` an
          # existing path is an error rather than something adopted in silence, which
          # makes the refusal above a second line of defence instead of the only one.
          # The chmod and the read-back below stay, as VERIFICATION rather than as the
          # protection.
          #
          # Checked on its own line rather than captured, for the reason the baseline
          # step states: `x=$(...)` discards the exit code.
          if ! out=$(mkdir -m 700 "${dir}" 2>&1); then
            echo "::error title=AI review UNMEASURED::the findings directory under RUNNER_TEMP could not be created, so the reviewer has nowhere outside the checkout to write its payload. Refusing here rather than letting the review run and report as a reviewer that wrote nothing, which is a verdict about the reviewer and this is a failure of the runner: $(escape_annotation "${out}")" >&2
            exit 1
          fi

          # 0700, so a job sharing the runner cannot read the findings or plant one —
          # and the next four readings are what make that sentence true rather than
          # merely written down. A `|| true` here would be a hardening that cannot
          # fail: the step would continue with a world-readable directory and report
          # success, which is the defect class this whole file is about.
          if ! out=$(chmod 700 "${dir}" 2>&1); then
            echo "::error title=AI review UNMEASURED::the findings directory under RUNNER_TEMP could not be set to mode 0700, so the reviewer's payload would be readable — and plantable — by any other job sharing this runner. Refusing rather than continuing with an unprotected directory: $(escape_annotation "${out}")" >&2
            exit 1
          fi

          # chmod's exit code is a CLAIM. A filesystem that does not carry POSIX modes
          # accepts the call and changes nothing, so the mode is read back. Both
          # spellings are attempted rather than looked up with `command -v`, for the
          # reason `sha256_of` gives: a tool that is present and broken and a tool
          # that is absent produce the same useless answer.
          mode=
          if m=$(stat -c '%a' "${dir}" 2>/dev/null) && [ -n "${m}" ]; then
            mode="${m}"
          elif m=$(stat -f '%Lp' "${dir}" 2>/dev/null) && [ -n "${m}" ]; then
            mode="${m}"
          fi

          if [ -z "${mode}" ]; then
            echo "::error title=AI review UNMEASURED::the findings directory under RUNNER_TEMP was created and chmod reported success, but its mode could not be READ BACK — neither the GNU nor the BSD spelling of stat could be run — so whether the payload is protected from other jobs on this runner is UNMEASURED. Refusing: it is 0700 and nobody looked must not be the same answer" >&2
            exit 1
          fi

          if [ "${mode}" != 700 ]; then
            echo "::error title=AI review UNMEASURED::the findings directory under RUNNER_TEMP is not mode 0700 after chmod reported success, so the filesystem did not take it and the reviewer's payload would be readable — and plantable — by any other job sharing this runner. Refusing rather than trusting the chmod's exit code over the directory's actual mode. Mode read back: $(escape_annotation "${mode}")" >&2
            exit 1
          fi

          if [ ! -O "${dir}" ]; then
            echo "::error title=AI review UNMEASURED::the findings directory under RUNNER_TEMP is not owned by this job after this step created it, so something else on this runner holds it and the 0700 protects the wrong user. Refusing: $(escape_annotation "${dir}")" >&2
            exit 1
          fi

          # The mode bits are a reading about PERMISSION. They say nothing about a
          # read-only mount, a full disk or a quota, and `[ -w ]` tests the same bits
          # a second time rather than the thing the reviewer needs. So the last
          # reading is a write.
          probe="${dir}/.ai-review-write-probe"
          if ! out=$({ printf '' > "${probe}"; } 2>&1); then
            echo "::error title=AI review UNMEASURED::the findings directory under RUNNER_TEMP is 0700 and owned by this job, and a write into it STILL failed, so the reviewer cannot write its payload there. A read-only mount, a full disk or a quota is the shape left once the mode and the owner have been read back. Refusing rather than reporting a reviewer that wrote nothing: $(escape_annotation "${out}")" >&2
            exit 1
          fi
          rm -f "${probe}"

          # A leftover from a previous attempt on a reused runner is a stale clean
          # payload read as this run's result. Same fail-open, a clock instead of an
          # attacker.
          rm -f "${path}"

          echo "ai-review findings path: ${path}"
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
          echo "dir=${dir}" >> "${GITHUB_OUTPUT}"
      - name: Authenticate to Vertex AI
        id: ai-review-vertex-auth
        continue-on-error: true
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: jhorn-pai
          workload_identity_provider: projects/939083080179/locations/global/workloadIdentityPools/github/providers/github-actions
      - name: Move the cloud credential out of the workspace
        id: ai-review-creds-relocate
        run: |
          # Generated by rungate — lib/scaffold/ai-review-step.ts. Do not edit.
          set -uo pipefail

          escape_annotation() {
            local v="$1"
            v="${v//%/%25}"
            v="${v//$'\r'/%0D}"
            v="${v//$'\n'/%0A}"
            printf '%s' "${v}"
          }

          # No credential file was created — the auth step did not run, or ran without
          # `create_credentials_file`. Nothing is in the workspace, so there is nothing
          # to move and nothing to say. Silence is the honest reading here and ONLY
          # here: every other branch below is a credential whose whereabouts are known
          # to be wrong.
          if [ -z "${GOOGLE_GHA_CREDS_PATH:-}" ]; then
            exit 0
          fi

          src="${GOOGLE_GHA_CREDS_PATH}"

          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::error title=AI review credential exposure::RUNNER_TEMP is not set, so there is nowhere outside the checkout to put the cloud credential. Refusing rather than running the reviewer with a live bearer token in the directory it reads." >&2
            exit 1
          fi

          if [ ! -f "${src}" ]; then
            echo "::error title=AI review credential exposure::GOOGLE_GHA_CREDS_PATH names a file that is not there. The variable is set, so the auth step created a credential; something else has moved or removed it and nobody can say where it is. That is UNMEASURED, not clean." >&2
            exit 1
          fi

          # #893. The deny rule reaches the review step through this file and nothing
          # else. Without it the step would move the credential and then be unable to
          # say where, the review would run with no rule covering it, and the only
          # trace would be a rule that renders empty — the fail-open this output's
          # shape accepts for an unresolved expression, arriving here where it can be
          # refused instead.
          if [ -z "${GITHUB_OUTPUT:-}" ]; then
            echo "::error title=AI review credential exposure::GITHUB_OUTPUT is not set, so this step cannot tell the review step which directory holds the cloud credential and the reviewer would run with no rule denying it. Refusing rather than moving a live bearer token to a place nothing is told to keep the reviewer out of" >&2
            exit 1
          fi

          nonce="${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"

          # #893. Its OWN directory, holding the credential and nothing else, so the
          # deny rule below has a region to name. Not RUNNER_TEMP's root: that is where
          # the drift baseline lives and, until #824, where the findings payload the
          # reviewer is told to write lived too — a rule naming it would deny the
          # reviewer its own output.
          dir="${RUNNER_TEMP}/ai-review-creds-${nonce}.d"

          # FIRST, before anything that dereferences. `-e`, `-d` and `-O` all
          # follow symlinks, so a link left by an earlier job on this runner would
          # otherwise decide where a live bearer token gets written.
          if [ -L "${dir}" ]; then
            echo "::error title=AI review credential exposure::the credential directory path under RUNNER_TEMP is a SYMLINK, so a link left by an earlier job on this runner would decide where this job writes a live bearer token. Refusing, and not following or removing it: $(escape_annotation "${dir}")" >&2
            exit 1
          fi

          if [ -e "${dir}" ]; then
            echo "::error title=AI review credential exposure::the credential directory under RUNNER_TEMP already exists. Its name carries this run id and attempt, so nothing this job did put it there, and the cloud credential would be moved into something another user on this runner controls. Refusing rather than adopting it — and not deleting it, because what to do with another user's directory is not this job's decision: $(escape_annotation "${dir}")" >&2
            exit 1
          fi

          # `-m 700` at creation and no `-p`: no window in which a directory about
          # to hold a credential is world-readable, and an existing path is an error
          # rather than something adopted. chmod and the read-back below are the
          # verification, not the protection.
          if ! out=$(mkdir -m 700 "${dir}" 2>&1); then
            echo "::error title=AI review credential exposure::the credential directory under RUNNER_TEMP could not be created, so there is nowhere to put the cloud credential that the reviewer's deny rule names. Refusing rather than leaving the token in the job scratch directory the reviewer can enumerate: $(escape_annotation "${out}")" >&2
            exit 1
          fi

          # No `|| true`. A hardening that cannot fail is not a hardening, and this
          # one is holding a live bearer token.
          if ! out=$(chmod 700 "${dir}" 2>&1); then
            echo "::error title=AI review credential exposure::the credential directory under RUNNER_TEMP could not be set to mode 0700, so the cloud credential would be readable by any other job sharing this runner. Refusing: $(escape_annotation "${out}")" >&2
            exit 1
          fi

          # chmod's exit code is a claim; the mode is read back. Same two spellings
          # and same reason as `buildPrepareScript`.
          mode=
          if m=$(stat -c '%a' "${dir}" 2>/dev/null) && [ -n "${m}" ]; then
            mode="${m}"
          elif m=$(stat -f '%Lp' "${dir}" 2>/dev/null) && [ -n "${m}" ]; then
            mode="${m}"
          fi

          if [ "${mode}" != 700 ]; then
            echo "::error title=AI review credential exposure::the credential directory under RUNNER_TEMP is not mode 0700 after chmod reported success, or its mode could not be read back at all, so whether the cloud credential is protected from other jobs on this runner is UNMEASURED. Refusing: "it is 0700" and "nobody looked" must not be the same answer. Mode read back: $(escape_annotation "${mode:-<unreadable>}")" >&2
            exit 1
          fi

          dest="${dir}/ai-review-gcp-creds-${nonce}.json"

          # Checked on its own line rather than captured, for the reason the baseline
          # step states: `x=$(...)` discards the exit code.
          if ! out=$(mv -f "${src}" "${dest}" 2>&1); then
            echo "::error title=AI review credential exposure::the cloud credential could not be moved out of the workspace: $(escape_annotation "${out}")" >&2
            exit 1
          fi

          # Defence in depth and nothing more: the reviewer runs as this user, so the
          # file mode is no barrier to it. The DIRECTORY's 0700, read back above, is
          # what keeps other users off; the deny rule below is what keeps the reviewer
          # off. This refuses on a non-zero exit rather than `|| true`, and its mode
          # is deliberately not read back — the directory's reading already covers the
          # filesystem-ignores-modes case for this path.
          if ! out=$(chmod 600 "${dest}" 2>&1); then
            echo "::error title=AI review credential exposure::the cloud credential file could not be set to mode 0600 after it was moved. Refusing: $(escape_annotation "${out}")" >&2
            exit 1
          fi

          # Every variable the auth step exported follows the file. GOOGLE_GHA_CREDS_PATH
          # is the one the action's post step reads to decide what to delete; the other
          # two are what downstream tooling reads to authenticate. Rewriting a subset
          # points something at a path that no longer exists, and the failure lands in
          # whichever step reads the one that was missed rather than in this one.
          {
            echo "GOOGLE_GHA_CREDS_PATH=${dest}"
            echo "GOOGLE_APPLICATION_CREDENTIALS=${dest}"
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=${dest}"
          } >> "${GITHUB_ENV}"

          echo "ai-review credential moved out of the workspace: ${dest}"

          # #893. The deny rule, built here and travelling whole — see
          # `AI_REVIEW_CREDS_DENY_OUTPUT` for why the comma and the glob are part of
          # the value rather than assembled around it in the generator.
          #
          # Spelled against Read, and against nothing else: Claude Code consults path
          # rules for the Edit and Read tools ONLY, and accepts rules naming the other
          # tools while never consulting them. A path rule naming one of those would
          # read as a second barrier and be worth nothing, which is the shape this
          # whole file exists to refuse. The tool names are left bare here on purpose
          # — a parenthesised one in a comment is indistinguishable from a rule to
          # the scan in ai-review-write-scope.test.ts, which this sentence tripped.
          echo "denyread=,Read(${dir}/**)" >> "${GITHUB_OUTPUT}"

          # A READING, not a belief. The move above is correct only while the auth
          # action writes one file, which is measured rather than assumed — and this is
          # the line that notices the day it stops being true.
          left=$(find "${GITHUB_WORKSPACE:-.}" -maxdepth 1 -name 'gha-creds-*.json' -print 2>/dev/null || true)
          if [ -n "${left}" ]; then
            echo "::error title=AI review credential exposure::the workspace still holds a credential this step did not move. The auth action writes exactly one file today; a second one means that is no longer true and the reviewer would read it. Refusing: $(escape_annotation "${left}")" >&2
            exit 1
          fi
      - name: Restore untrusted paths from the pull request base
        id: ai-review-restore-untrusted
        env:
          AI_REVIEW_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generated by rungate — lib/scaffold/ai-review-step.ts. Do not edit.
          set -uo pipefail

          escape_annotation() {
            local v="$1"
            v="${v//%/%25}"
            v="${v//$'\r'/%0D}"
            v="${v//$'\n'/%0A}"
            printf '%s' "${v}"
          }

          if [ -z "${AI_REVIEW_BASE_REF:-}" ]; then
            echo "::error title=AI review modified the tree::the pull request base ref is empty, so there is no commit to restore the untrusted paths from. Refusing: an unrestored head is the input this step exists to replace, and a run that skipped it is UNMEASURED rather than clean." >&2
            exit 1
          fi

          # #867. A pull request's `base.ref` is a bare branch name; a merge group's
          # `base_ref` is fully qualified. The refspec below builds
          # `refs/heads/<ref>`, so the qualified form would ask for
          # `refs/heads/refs/heads/main` and the fetch would fail — the silent hang
          # replaced by a red queue one layer further in.
          #
          # Prefix-stripping and NOT `basename`/`cut`: a branch name may contain a
          # slash, and a blind last-component read would turn `release/1.2` into
          # `1.2` on the event that works today. Conditional on the prefix being
          # present, so the bare form passes through untouched.
          base_ref="${AI_REVIEW_BASE_REF#refs/heads/}"

          if [ -z "${base_ref}" ]; then
            echo "::error title=AI review modified the tree::the pull request base ref is empty, so there is no commit to restore the untrusted paths from. Refusing: an unrestored head is the input this step exists to replace, and a run that skipped it is UNMEASURED rather than clean." >&2
            exit 1
          fi

          base_remote="refs/remotes/origin/${base_ref}"

          # Through the environment, never `-c`: a value passed with `-c` is in the
          # command line of the git process and readable by anything that can run `ps`.
          AI_REVIEW_GIT_AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN:-}" | base64 | tr -d '\n')"
          export AI_REVIEW_GIT_AUTH

          # Checked on its own line, never captured into an assignment, for the reason
          # the baseline step states.
          if ! out=$(git --config-env=http.extraheader=AI_REVIEW_GIT_AUTH fetch --no-tags --depth=1 \
            origin "+refs/heads/${base_ref}:${base_remote}" 2>&1); then
