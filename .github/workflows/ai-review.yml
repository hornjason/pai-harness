                    # the `-c` half that matters here: `--no-filters` already
                    # defeats a text/eol conversion, but a hash taken under the
                    # reviewer's config is still a reading the reviewer chose.
                    h=$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_NOSYSTEM=1 git -c core.fsmonitor= -c core.excludesFile=/dev/null -c core.hooksPath=/dev/null -c safe.directory='*' hash-object --no-filters -- "${p}" 2>/dev/null) || h=unreadable
